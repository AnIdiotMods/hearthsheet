# Temporary: explores how the Android emulator, the iOS Simulator and macOS expose the app to
# accessibility-based test drivers. Runs on pushes to the e2e branch.
name: E2E discovery
on:
  push:
    branches: [e2e]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - run: curl -fsSL -o app.apk https://github.com/AnIdiotMods/hearthsheet/raw/builds/0.4.0/Hearthsheet_0.4.0_android.apk
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r app.apk
            bash e2e/discover/mobile.sh android
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: discover-android, path: out }

  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Pick the Simulator architecture
        run: |
          if [ "$(uname -m)" = arm64 ]; then T=aarch64-apple-ios-sim; A=arm64; else T=x86_64-apple-ios; A=x86_64; fi
          echo "SIM_TRIPLE=$T" >> "$GITHUB_ENV"; echo "SIM_ARCH=$A" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: 'aarch64-apple-ios-sim,x86_64-apple-ios' }
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri -> target }
      - run: npm ci
      - run: brew install xcodegen
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Build the app for the iOS Simulator
        run: |
          npm run build
          cargo build --manifest-path src-tauri/Cargo.toml --release --lib --target "$SIM_TRIPLE" --features tauri/custom-protocol
          npx tauri ios init --ci
          grep -n "Externals\|xcode-script" src-tauri/gen/apple/project.yml || true
          python3 - <<'PY'
          import os, re, pathlib
          p = pathlib.Path('src-tauri/gen/apple/project.yml')
          lib = f'"$SRCROOT/../../target/{os.environ["SIM_TRIPLE"]}/release/libhearthsheet_lib.a"'
          cmd = ('for d in arm64 arm64-sim x86_64; do mkdir -p "$SRCROOT/Externals/$d/${CONFIGURATION}" && cp ' + lib +
                 ' "$SRCROOT/Externals/$d/${CONFIGURATION}/libapp.a"; done')
          lines = p.read_text().split('\n')
          for i, line in enumerate(lines):
              if 'xcode-script' in line:
                  m = re.match(r'^(\s*(?:- )?script:\s*)', line)
                  lines[i] = (m.group(1) if m else re.match(r'^\s*', line).group(0)) + cmd
          s = '\n'.join(lines)
          assert 'xcode-script' not in s
          p.write_text(s)
          PY
          (cd src-tauri/gen/apple && xcodegen generate)
          PROJECT=$(ls -d src-tauri/gen/apple/*.xcodeproj | head -1)
          SCHEME=$(xcodebuild -list -project "$PROJECT" | awk '/Schemes:/{f=1;next} f&&NF{print $1; exit}')
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" -configuration release -sdk iphonesimulator \
            -derivedDataPath "$RUNNER_TEMP/dd" ARCHS="$SIM_ARCH" ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build | tail -20
          APP=$(find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 2 -name '*.app' | head -1)
          echo "APP=$APP" >> "$GITHUB_ENV"; ls -la "$APP"
      - name: Start an iPhone Simulator and install the app
        run: |
          xcrun simctl list devices available | grep -E "iPhone|iPad" | head -20
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; c=[x for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')]; print(c[-1]['udid'])")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
      - run: bash e2e/discover/mobile.sh ios
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: discover-ios, path: out }

  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: bash e2e/discover/mac.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: discover-macos, path: out }
