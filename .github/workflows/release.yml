# Builds Hearthsheet for Windows, macOS, Linux, Android and iOS from the same code.
# Push a tag such as v0.4.0 to build everything and attach it to a draft GitHub release, or run it
# by hand from the Actions tab. Signing uses repository secrets when they exist (docs/SIGNING.md);
# without them the builds are produced unsigned.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npm test

  desktop:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.platform }}
    env:
      HAS_WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
      HAS_AZURE_SIGNING: ${{ secrets.AZURE_SIGNING_ENDPOINT != '' }}
      HAS_LINUX_GPG_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri -> target }
      - name: Linux build libraries
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm libfuse2 xdg-utils
      - run: npm ci

      - name: Import the Linux GPG signing key
        if: matrix.platform == 'ubuntu-22.04' && env.HAS_LINUX_GPG_KEY == 'true'
        env:
          LINUX_GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
        run: echo "$LINUX_GPG_PRIVATE_KEY" | gpg --batch --import
      - name: Import the Windows code-signing certificate
        if: matrix.platform == 'windows-latest' && env.HAS_WINDOWS_CERTIFICATE == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'cert.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $pass = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pass
          Remove-Item $pfx
          "WINDOWS_CERTIFICATE_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Install Azure Trusted Signing tool
        if: matrix.platform == 'windows-latest' && env.HAS_AZURE_SIGNING == 'true'
        run: cargo install trusted-signing-cli --locked
      - name: Export the signing secrets that are set
        # Tauri treats a variable that exists but is empty as "sign with this", so only set the ones that have values.
        shell: bash
        env:
          S_AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          S_AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          S_AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          S_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          S_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          S_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          S_APPLE_ID: ${{ secrets.APPLE_ID }}
          S_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          S_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          S_SIGN_KEY: ${{ secrets.LINUX_GPG_KEY_ID }}
          S_APPIMAGETOOL_SIGN_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
        run: |
          for v in AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_TENANT_ID APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD \
                   APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID SIGN_KEY APPIMAGETOOL_SIGN_PASSPHRASE; do
            val="S_$v"
            if [ -n "${!val}" ]; then
              { echo "$v<<__END__"; echo "${!val}"; echo "__END__"; } >> "$GITHUB_ENV"
            fi
          done
          if [ -n "$S_SIGN_KEY" ]; then echo "SIGN=1" >> "$GITHUB_ENV"; fi
      - name: Signing settings
        env:
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
        run: node scripts/signing-config.mjs

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # AppImage tools run without FUSE on the build machines; stripping breaks on newer libraries.
          APPIMAGE_EXTRACT_AND_RUN: 1
          NO_STRIP: true
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: 'Hearthsheet ${{ github.ref_name }}'
          releaseDraft: true
          args: --config src-tauri/tauri.signing.json ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: hearthsheet-${{ matrix.platform }}
          path: |
            src-tauri/target/**/release/bundle/**/*.exe
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/macos/*.app
            src-tauri/target/**/release/bundle/**/*.app.tar.gz
            src-tauri/target/**/release/bundle/**/*.deb
            src-tauri/target/**/release/bundle/**/*.rpm
            src-tauri/target/**/release/bundle/**/*.AppImage

  android:
    needs: test
    runs-on: ubuntu-24.04
    env:
      HAS_ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
        with: { packages: 'platform-tools' }
      - run: sdkmanager "ndk;27.2.12479018" "platforms;android-35" "build-tools;35.0.0"
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: 'aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android' }
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri -> target }
      - run: npm ci
      - name: Release signing key
        if: env.HAS_ANDROID_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "password=$ANDROID_KEY_PASSWORD"
          } > src-tauri/gen/android/keystore.properties
      - name: Build
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: npx tauri android build --apk --aab
      - uses: actions/upload-artifact@v4
        with:
          name: hearthsheet-android
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/**/*.aab

  ios:
    needs: test
    runs-on: macos-latest
    env:
      HAS_APPLE_SIGNING: ${{ secrets.APPLE_API_KEY_P8 != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: 'aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios' }
      - run: npm ci
      - run: brew install xcodegen
      - name: Generate the Xcode project
        run: '[ -d src-tauri/gen/apple ] || npx tauri ios init --ci'

      # With an Apple Developer account: a signed build for TestFlight / the App Store.
      - name: App Store Connect API key
        if: env.HAS_APPLE_SIGNING == 'true'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          mkdir -p ~/private_keys
          echo "$APPLE_API_KEY_P8" > ~/private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
          echo "APPLE_API_KEY_PATH=$HOME/private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8" >> "$GITHUB_ENV"
      - name: Signed build
        if: env.HAS_APPLE_SIGNING == 'true'
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: npx tauri ios build --export-method app-store-connect

      # Without one: an unsigned .ipa. Sideloading tools (Sideloadly, AltStore) sign it with a free
      # Apple ID when they install it; Apple limits such installs to 7 days before re-installing.
      - name: Unsigned build
        if: env.HAS_APPLE_SIGNING != 'true'
        run: |
          npm run build
          # The generated Xcode project compiles the Rust code through `tauri ios xcode-script`, which only works
          # while `tauri ios build` (which needs signing) is running. Build the library here and copy it to where
          # Xcode links it from, then regenerate the project with that step replaced.
          cargo build --manifest-path src-tauri/Cargo.toml --release --lib --target aarch64-apple-ios --features tauri/custom-protocol
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path('src-tauri/gen/apple/project.yml')
          s = p.read_text()
          s = re.sub(r'(script: )npm run -- tauri ios xcode-script[^\n]*',
                     r'\1mkdir -p "$SRCROOT/Externals/arm64/${CONFIGURATION}" && cp "$SRCROOT/../../target/aarch64-apple-ios/release/libhearthsheet_lib.a" "$SRCROOT/Externals/arm64/${CONFIGURATION}/libapp.a"', s)
          assert 'xcode-script' not in s, 'the Rust build step in project.yml was not replaced'
          p.write_text(s)
          PY
          (cd src-tauri/gen/apple && xcodegen generate)
          PROJECT=$(ls -d src-tauri/gen/apple/*.xcodeproj | head -1)
          SCHEME=$(xcodebuild -list -project "$PROJECT" | awk '/Schemes:/{f=1;next} f&&NF{print $1; exit}')
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" -configuration release -sdk iphoneos \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Hearthsheet.xcarchive" archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" ARCHS=arm64
          APP=$(find "$RUNNER_TEMP/Hearthsheet.xcarchive/Products/Applications" -maxdepth 1 -name '*.app' | head -1)
          mkdir -p "$RUNNER_TEMP/ipa/Payload" src-tauri/gen/apple/build/unsigned
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qr "$GITHUB_WORKSPACE/src-tauri/gen/apple/build/unsigned/Hearthsheet-unsigned.ipa" Payload)
      - uses: actions/upload-artifact@v4
        with:
          name: hearthsheet-ios
          path: src-tauri/gen/apple/build/**/*.ipa
