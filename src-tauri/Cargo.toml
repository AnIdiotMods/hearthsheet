[package]
name = "hearthsheet"
version = "0.4.0"
description = "Open-source 5e character manager"
authors = ["Hearthsheet contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
# The mobile targets load the app as a library; desktop builds a normal binary from main.rs.
name = "hearthsheet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
